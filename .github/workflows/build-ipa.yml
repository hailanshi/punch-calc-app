# PunchCalc 云端自动打包（失败时把编译日志公开到 debug-log 分支供读取）
name: Build PunchCalc IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-shell/PunchCalcApp
        run: xcodegen generate

      - name: Build & capture log (真实成败)
        working-directory: ios-shell/PunchCalcApp
        shell: bash
        run: |
          set +e
          {
            echo "===== SCHEMES ====="
            xcodebuild -list -project PunchCalc.xcodeproj 2>&1
            echo "===== BUILD START ====="
            xcodebuild \
              -project PunchCalc.xcodeproj \
              -scheme PunchCalc \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              -sdk iphoneos \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1
            echo "===== BUILD END ====="
          } | tee build.log
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$code"
          if [ "$code" -ne 0 ]; then
            echo "::error::BUILD FAILED (exit $code)"
            tail -40 build.log
          fi
          exit $code

      - name: Publish build log to debug-log branch (失败时)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp ios-shell/PunchCalcApp/build.log build.log 2>/dev/null || cp build.log build.log 2>/dev/null || echo "(no build.log)" > build.log
          git checkout -B debug-log 2>/dev/null
          git add -f build.log
          git commit -m "build log" 2>/dev/null || true
          git push origin debug-log --force 2>&1 | tail -3
          echo "done"

      - name: Bundle HTML & sign
        working-directory: ios-shell/PunchCalcApp
        run: |
          APP="build/Build/Products/Release-iphoneos/PunchCalc.app"
          cp Resources/index.html "$APP/index.html"
          mkdir -p "$APP/www"
          cp Resources/index.html "$APP/www/index.html"
          [ -f Resources/AppIcon60x60@3x.png ] && cp Resources/AppIcon60x60@3x.png "$APP/AppIcon60x60@3x.png" || true
          [ -f Resources/AppIcon60x60@2x.png ] && cp Resources/AppIcon60x60@2x.png "$APP/AppIcon60x60@2x.png" || true
          codesign --force --sign - "$APP"
          echo "bundle 内容:"; ls -la "$APP"
          test -f "$APP/PunchCalc" && echo "主程序PunchCalc存在" || { echo "主程序缺失!"; exit 1; }

      - name: Package IPA
        working-directory: ios-shell/PunchCalcApp
        run: |
          APP="build/Build/Products/Release-iphoneos/PunchCalc.app"
          mkdir -p _payload/Payload
          cp -R "$APP" _payload/Payload/PunchCalc.app
          ( cd _payload && zip -qry "${GITHUB_WORKSPACE}/punch-calculator.ipa" Payload )

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: punch-calculator-ipa
          path: punch-calculator.ipa
          if-no-files-found: error
