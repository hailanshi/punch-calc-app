# PunchCalc 云端自动打包（带可靠日志抓取）
name: Build PunchCalc IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-shell/PunchCalcApp
        run: xcodegen generate

      - name: Build & capture log
        working-directory: ios-shell/PunchCalcApp
        shell: bash
        run: |
          set +e
          {
            echo "===== SCHEMES ====="
            xcodebuild -list -project PunchCalc.xcodeproj 2>&1
            echo "===== BUILD START ====="
            xcodebuild \
              -project PunchCalc.xcodeproj \
              -scheme PunchCalc \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              -sdk iphoneos \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1
            echo "===== BUILD END ====="
          } | tee build.log
          code=${PIPESTATUS[0]}
          echo "STEP_EXIT_CODE=$code"
          ls -la build.log
          exit $code

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios-shell/PunchCalcApp/build.log
          if-no-files-found: warn

      - name: Ad-hoc sign
        if: success()
        working-directory: ios-shell/PunchCalcApp
        run: |
          APP="build/Build/Products/Release-iphoneos/PunchCalc.app"
          codesign --force --sign - "$APP" || true

      - name: Package IPA
        if: success()
        working-directory: ios-shell/PunchCalcApp
        run: |
          APP="build/Build/Products/Release-iphoneos/PunchCalc.app"
          mkdir -p _payload/Payload
          cp -R "$APP" _payload/Payload/PunchCalc.app
          ( cd _payload && zip -qry ../../punch-calculator.ipa Payload )

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: punch-calculator-ipa
          path: punch-calculator.ipa
          if-no-files-found: error
