# =====================================================================
# PunchCalc - 云端自动打包 .ipa（免费，无 Mac / 无开发者账号）
# 收到推送后自动：xcodegen 生成工程 -> 编译 -> 注入 index.html/图标 -> 打 .ipa
# 失败时会单独上传 build.log 供排查；成功则上传 punch-calculator.ipa。
# =====================================================================
name: Build PunchCalc IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-shell/PunchCalcApp
        run: xcodegen generate

      - name: Build & diagnose
        working-directory: ios-shell/PunchCalcApp
        run: |
          echo "===== SCHEMES ====="
          xcodebuild -list -project PunchCalc.xcodeproj 2>&1
          echo "===== BUILD START ====="
          xcodebuild \
            -project PunchCalc.xcodeproj \
            -scheme PunchCalc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          echo "===== BUILD END (exit ${PIPESTATUS[0]}) ====="

      - name: Upload build log (always, for troubleshooting)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios-shell/PunchCalcApp/build.log
          if-no-files-found: ignore

      - name: Ad-hoc sign
        if: success()
        working-directory: ios-shell/PunchCalcApp
        run: |
          APP="build/Build/Products/Release-iphoneos/PunchCalc.app"
          codesign --force --sign - "$APP" || true

      - name: Package IPA
        if: success()
        working-directory: ios-shell/PunchCalcApp
        run: |
          APP="build/Build/Products/Release-iphoneos/PunchCalc.app"
          mkdir -p _payload/Payload
          cp -R "$APP" _payload/Payload/PunchCalc.app
          ( cd _payload && zip -qry ../../punch-calculator.ipa Payload )

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: punch-calculator-ipa
          path: punch-calculator.ipa
          if-no-files-found: error
